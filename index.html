<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - User</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #27ae60; --secondary: #e67e22; }
        body { font-family: 'Segoe UI', sans-serif; background: #e8f5e9; margin: 0; padding: 0; }
        .header { 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=800&q=80');
            background-size: cover; background-position: center; color: white; 
            padding: 40px 20px; text-align: center; font-size: 28px; font-weight: bold; 
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
        }
        .container { max-width: 400px; margin: -20px auto 30px; padding: 20px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input { width: 92%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        .btn { background: var(--secondary); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 18px; cursor: pointer; font-weight: bold; }
        #status-box { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; background: #f8f9fa; border: 1px solid #eee; }
        .fare-tag { color: var(--primary); font-weight: bold; text-align: center; margin: 10px 0; display: block; }
    </style>
</head>
<body>

<div class="header">🌳 Village Ride</div>

<div class="container">
    <div id="booking-ui">
        <input type="number" id="user-phone" placeholder="మీ ఫోన్ నంబర్">
        <input type="text" id="pickup" placeholder="ఎక్కడ నుండి?">
        <input type="number" id="distance" placeholder="ఎన్ని కిలోమీటర్లు? (సుమారుగా)" oninput="calcFare()">
        <input type="text" id="drop" placeholder="ఎక్కడికి? (Drop Location)">
        
        <span id="fare-estimate" class="fare-tag"></span>
        
        <button class="btn" onclick="bookRide()">బండి బుక్ చేయండి 🚕</button>
    </div>
    <div id="status-box"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
        authDomain: "village-ride-e139b.firebaseapp.com",
        projectId: "village-ride-e139b",
        storageBucket: "village-ride-e139b.firebasestorage.app",
        messagingSenderId: "869545503903",
        appId: "1:869545503903:web:35efe840f51f382ecf86aa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.calcFare = () => {
        const dist = document.getElementById('distance').value;
        const fareBox = document.getElementById('fare-estimate');
        if(dist > 0) {
            let fare = 10; // మొదటి కిలోమీటర్ కి ₹10
            if(dist > 1) fare = 10 + (dist - 1) * 3; // తర్వాత ప్రతి కి.మీ కి ₹3
            fareBox.innerText = "సుమారు ప్రయాణ ధర: ₹" + fare;
            return fare;
        }
        fareBox.innerText = "";
        return 0;
    };

    window.bookRide = async () => {
        const phone = document.getElementById('user-phone').value;
        const p = document.getElementById('pickup').value;
        const d = document.getElementById('drop').value;
        const dist = document.getElementById('distance').value;
        const fare = calcFare();

        if(!phone || !p || !d || !dist) { alert("అన్ని వివరాలు నింపండి"); return; }

        try {
            const docRef = await addDoc(collection(db, "rides"), {
                userPhone: phone, pickup: p, drop: d, fare: fare,
                status: "pending", timestamp: Date.now()
            });

            document.getElementById('booking-ui').style.display = 'none';
            const sBox = document.getElementById('status-box');
            sBox.style.display = 'block';
            sBox.innerHTML = "⏳ డ్రైవర్ కోసం వెతుకుతున్నాము...";

            onSnapshot(doc(db, "rides", docRef.id), (docSnap) => {
                const data = docSnap.data();
                if (data.status === "accepted") {
                    sBox.innerHTML = `✅ డ్రైవర్ దొరికారు!<br><b>పేరు:</b> ${data.driverName}<br><b>బండి:</b> ${data.bikeNumber}<br><b>ధర:</b> ₹${data.fare}<br><a href="tel:${data.driverPhone}" style="display:block; margin-top:10px; background:green; color:white; padding:10px; text-decoration:none; border-radius:5px; text-align:center;">📞 కాల్ చేయండి</a>`;
                } else if (data.status === "completed") {
                    sBox.innerHTML = "🏁 ప్రయాణం పూర్తయింది. ధన్యవాదాలు!";
                    setTimeout(() => location.reload(), 3000);
                }
            });
        } catch (e) { alert(e.message); }
    };
</script>
</body>
</html>
