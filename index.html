<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - మీ ప్రయాణ తోడు</title>
    
    <!-- PWA సెటప్ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>

    <style>
        :root { --primary: #27ae60; --secondary: #e67e22; }
        body { font-family: 'Segoe UI', sans-serif; background: #e8f5e9; margin: 0; padding: 0; }
        
        /* పల్లెటూరు బ్యాక్‌గ్రౌండ్ హెడర్ */
        .header { 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            color: white; 
            padding: 50px 20px; 
            text-align: center; 
            font-size: 32px; 
            font-weight: bold; 
            border-bottom-left-radius: 40px; 
            border-bottom-right-radius: 40px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .container { max-width: 400px; margin: -30px auto 30px; padding: 25px; background: white; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); position: relative; }
        
        p { color: #555; font-weight: 500; }
        input { width: 90%; padding: 15px; margin: 12px 0; border: 2px solid #e0e0e0; border-radius: 15px; outline: none; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(39, 174, 96, 0.2); }
        
        .btn { background: var(--secondary); color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3); transition: 0.3s; }
        .btn:hover { background: #d35400; transform: translateY(-2px); }
        
        #status-box { margin-top: 20px; padding: 20px; border-radius: 15px; display: none; text-align: center; line-height: 1.6; }
        .accepted { background: #d4edda; color: #155724; border: 2px solid var(--primary); }
        .call-btn { display: block; margin-top: 15px; padding: 15px; background: var(--primary); color: white; text-decoration: none; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        🌳 Village Ride 🏍️<br>
        <span style="font-size: 16px; font-weight: normal; opacity: 0.9;">పల్లెటూరి ప్రయాణం.. ఇప్పుడు సులభం!</span>
    </div>

    <div class="container">
        <div id="booking-ui">
            <p>📍 ప్రయాణ వివరాలు పంపండి</p>
            <input type="text" id="pickup" placeholder="ఎక్కడ నుండి? (Pickup)">
            <input type="text" id="drop" placeholder="ఎక్కడికి? (Drop)">
            <button class="btn" onclick="bookRide()">బండి బుక్ చేయండి 🚕</button>
        </div>
        <div id="status-box"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
            authDomain: "village-ride-e139b.firebaseapp.com",
            projectId: "village-ride-e139b",
            storageBucket: "village-ride-e139b.firebasestorage.app",
            messagingSenderId: "869545503903",
            appId: "1:869545503903:web:35efe840f51f382ecf86aa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.bookRide = async () => {
            const p = document.getElementById('pickup').value;
            const d = document.getElementById('drop').value;
            if(!p || !d) { alert("దయచేసి వివరాలు నింపండి"); return; }

            const sBox = document.getElementById('status-box');
            try {
                const docRef = await addDoc(collection(db, "rides"), {
                    pickup: p, drop: d, status: "pending", timestamp: Date.now()
                });

                document.getElementById('booking-ui').style.display = 'none';
                sBox.style.display = 'block';
                sBox.className = 'status-box';
                sBox.innerHTML = "⏳ <b>డ్రైవర్ కోసం వెతుకుతున్నాము...</b><br>దయచేసి ఈ పేజీని క్లోజ్ చేయకండి.";

                onSnapshot(doc(db, "rides", docRef.id), (docSnap) => {
                    const data = docSnap.data();
                    if (data && data.status === "accepted") {
                        sBox.className = "accepted";
                        sBox.innerHTML = `✅ <b>డ్రైవర్ దొరికారు!</b><br>ఫోన్: ${data.driverPhone}<br>
                        <a href="tel:${data.driverPhone}" class="call-btn">📞 డ్రైవర్‌కు కాల్ చేయండి</a>`;
                    } else if (data && data.status === "completed") {
                        sBox.innerHTML = "🏁 <b>ప్రయాణం పూర్తయింది!</b><br>ధన్యవాదాలు. ✨";
                        setTimeout(() => { location.reload(); }, 4000);
                    }
                });
            } catch (e) { alert("Error: " + e.message); }
        };
    </script>
</body>
</html>
