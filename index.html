<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride</title>
    
    <!-- 🛺 గిట్‌హబ్ ఫోల్డర్ లో బొమ్మ లేకపోయినా వచ్చేలా ఇంటర్నెట్ బైక్ ఐకాన్ లింక్ -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3063/3063198.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063198.png">
    <meta name="theme-color" content="#2c3e50">

    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; display: block; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>Village Ride - యూజర్</h2>
    
    <div class="card">
        <h3>కొత్త రైడ్ బుక్ చేయండి</h3>
        <input type="text" id="u-phone" placeholder="మీ ఫోన్ నంబర్">
        <input type="text" id="pickup" placeholder="ఎక్కడ నుండి (Pickup)">
        <input type="text" id="drop" placeholder="ఎక్కడికి (Drop)">
        <input type="number" id="fare" placeholder="ఎంత డబ్బులు ఇస్తారు (Fare)">
        <button class="btn" onclick="window.bookRide()">రైడ్ బుక్ చేయి</button>
    </div>

    <div style="margin-top: 30px;">
        <a href="driver.html" style="color: #2c3e50; font-weight: bold;">డ్రైవర్ లాగిన్ పేజీకి వెళ్ళండి ➔</a>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
        authDomain: "village-ride-e139b.firebaseapp.com",
        projectId: "village-ride-e139b",
        appId: "1:869545503903:web:35efe840f51f382ecf86aa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.onload = () => {
        const p = localStorage.getItem('u-phone');
        if(p) document.getElementById('u-phone').value = p;
    };

    window.bookRide = async () => {
        const phone = document.getElementById('u-phone').value;
        const pickup = document.getElementById('pickup').value;
        const drop = document.getElementById('drop').value;
        const fare = document.getElementById('fare').value;

        if(!phone || !pickup || !drop || !fare) { alert("అన్ని వివరాలు నింపండి"); return; }
        localStorage.setItem('u-phone', phone);

        await addDoc(collection(db, "rides"), {
            userPhone: phone,
            pickup: pickup,
            drop: drop,
            fare: parseInt(fare),
            status: "pending",
            timestamp: Date.now()
        });

        alert("రైడ్ బుకింగ్ అభ్యర్థన పంపబడింది! కెప్టెన్ వచ్చే వరకు ఆగండి.");
        document.getElementById('pickup').value = "";
        document.getElementById('drop').value = "";
        document.getElementById('fare').value = "";
    };
</script>
</body>
</html>
