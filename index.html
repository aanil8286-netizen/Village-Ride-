<!-- user.html లో ఉండవలసిన కోడ్ -->
<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - User</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; text-align: center; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #f1c40f; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Village Ride 🏍️</h2>
        <input type="text" id="pickup" placeholder="మీ ఊరు (From)">
        <input type="text" id="drop" placeholder="వెళ్ళవలసిన ఊరు (To)">
        <button onclick="bookRide()">బండి బుక్ చేయండి</button>
        <p id="status" style="color: green; display: none;">వెతుకుతున్నాము...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = { // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
  authDomain: "village-ride-e139b.firebaseapp.com",
  projectId: "village-ride-e139b",
  storageBucket: "village-ride-e139b.firebasestorage.app",
  messagingSenderId: "869545503903",
  appId: "1:869545503903:web:35efe840f51f382ecf86aa",
  measurementId: "G-N23Y5LCWD0"
 };
        const db = getFirestore(initializeApp(firebaseConfig));

        window.bookRide = async function() {
            const p = document.getElementById('pickup').value;
            const d = document.getElementById('drop').value;
            if(!p || !d) return alert("వివరాలు నింపండి");
            await addDoc(collection(db, "rides"), { pickup: p, drop: d, status: "pending", time: new Date() });
            document.getElementById('status').style.display = 'block';
        };
    </script>
</body>
</html>
