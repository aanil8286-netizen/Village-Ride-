<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - User</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3198/3198336.png">
    <style>
        body { font-family: sans-serif; background: #f4f7f6; text-align: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        .btn { background: #e67e22; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #2c3e50;">Village Ride 🚕</h2>
        <p>మీ ప్రయాణ వివరాలు తెలపండి</p>
        <input type="text" id="pickup" placeholder="ఎక్కడ నుండి? (Pickup)">
        <input type="text" id="drop" placeholder="ఎక్కడికి? (Drop)">
        <button class="btn" onclick="bookRide()">బండి బుక్ చేయండి</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
  authDomain: "village-ride-e139b.firebaseapp.com",
  projectId: "village-ride-e139b",
  storageBucket: "village-ride-e139b.firebasestorage.app",
  messagingSenderId: "869545503903",
  appId: "1:869545503903:web:35efe840f51f382ecf86aa",
  measurementId: "G-N23Y5LCWD0"
};
        const firebaseConfig = {
            apiKey: "మీ_API_KEY",
            authDomain: "మీ_PROJECT_ID.firebaseapp.com",
            projectId: "మీ_PROJECT_ID",
            storageBucket: "మీ_PROJECT_ID.appspot.com",
            messagingSenderId: "మీ_SENDER_ID",
            appId: "మీ_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.bookRide = async () => {
            const p = document.getElementById('pickup').value;
            const d = document.getElementById('drop').value;

            if(!p || !d) { alert("దయచేసి రెండు ఊర్ల పేర్లు రాయండి"); return; }

            try {
                await addDoc(collection(db, "rides"), {
                    pickup: p,
                    drop: d,
                    status: "pending",
                    time: Date.now()
                });
                alert("రైడ్ రిక్వెస్ట్ పంపబడింది! డ్రైవర్ త్వరలో సంప్రదిస్తారు.");
                document.getElementById('pickup').value = "";
                document.getElementById('drop').value = "";
            } catch (e) {
                alert("Error: " + e.message);
            }
        };
    </script>
</body>
</html>
