<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - User</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; text-align: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn { background: #e67e22; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        #status-box { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; font-weight: bold; }
        .accepted { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .call-btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #27ae60; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Village Ride 🚕</h2>
        <div id="booking-ui">
            <input type="text" id="pickup" placeholder="ఎక్కడ నుండి? (Pickup)">
            <input type="text" id="drop" placeholder="ఎక్కడికి? (Drop)">
            <button class="btn" onclick="bookRide()">బండి బుక్ చేయండి</button>
        </div>
        <div id="status-box"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
            authDomain: "village-ride-e139b.firebaseapp.com",
            projectId: "village-ride-e139b",
            storageBucket: "village-ride-e139b.firebasestorage.app",
            messagingSenderId: "869545503903",
            appId: "1:869545503903:web:35efe840f51f382ecf86aa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.bookRide = async () => {
            const p = document.getElementById('pickup').value;
            const d = document.getElementById('drop').value;
            if(!p || !d) { alert("ఊర్ల పేర్లు రాయండి"); return; }

            try {
                const docRef = await addDoc(collection(db, "rides"), {
                    pickup: p, drop: d, status: "pending", timestamp: Date.now()
                });

                document.getElementById('booking-ui').style.display = 'none';
                const sBox = document.getElementById('status-box');
                sBox.style.display = 'block';
                sBox.innerHTML = "⏳ డ్రైవర్ కోసం వెతుకుతున్నాము...";

                onSnapshot(doc(db, "rides", docRef.id), (docSnap) => {
                    const rideData = docSnap.data();
                    if (rideData) {
                        if (rideData.status === "accepted") {
                            sBox.className = "accepted";
                            sBox.innerHTML = `✅ డ్రైవర్ అంగీకరించారు!<br>ఫోన్: ${rideData.driverPhone}<br>
                            <a href="tel:${rideData.driverPhone}" class="call-btn">📞 కాల్ చేయండి</a>`;
                        } else if (rideData.status === "completed") {
                            sBox.innerHTML = "🏁 మీ ప్రయాణం పూర్తయింది! ధన్యవాదాలు. ✨";
                            setTimeout(() => { location.reload(); }, 4000);
                        }
                    }
                });
            } catch (e) { alert("Error: " + e.message); }
        };
    </script>
</body>
</html>
