<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - Admin</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
        .header { background: #2c3e50; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .btn-approve { background: #27ae60; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h2>👑 అడ్మిన్ కంట్రోల్</h2>
</div>

<h3 style="text-align:left;">📥 రీఛార్జ్ అభ్యర్థనలు</h3>
<div id="requests-list">చూస్తున్నాము...</div>

<h3 style="text-align:left; margin-top:30px;">📊 డ్రైవర్ల వాలెట్ లిస్ట్</h3>
<div id="drivers-status">లోడ్ అవుతోంది...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, query, where, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    if(prompt("పాస్‌వర్డ్:") !== "456") window.location.href="about:blank";

    const firebaseConfig = {
        apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
        authDomain: "village-ride-e139b.firebaseapp.com",
        projectId: "village-ride-e139b",
        appId: "1:869545503903:web:35efe840f51f382ecf86aa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. అభ్యర్థనలు చూపడం
    onSnapshot(query(collection(db, "recharge_requests"), where("status", "==", "pending")), (snap) => {
        let html = "";
        snap.forEach(d => {
            const data = d.data();
            html += `<div class="card">
                <div><b>${data.driverName || 'డ్రైవర్'}</b> (${data.driverPhone})<br>మొత్తం: ₹${data.amount}</div>
                <button class="btn-approve" onclick="window.approveRequest('${d.id}', '${data.driverPhone}', ${data.amount})">అప్రూవ్</button>
            </div>`;
        });
        document.getElementById('requests-list').innerHTML = html || "కొత్త అభ్యర్థనలు లేవు.";
    });

    // 2. డ్రైవర్ల లిస్ట్ చూపడం
    onSnapshot(collection(db, "drivers"), (snap) => {
        let html = "";
        snap.forEach(d => {
            html += `<div class="card" style="border-left:5px solid #2c3e50;">
                <div>నంబర్: ${d.id}</div>
                <div style="font-weight:bold;">₹${d.data().balance}</div>
            </div>`;
        });
        document.getElementById('drivers-status').innerHTML = html;
    });

    // 3. అప్రూవ్ చేసే ఫంక్షన్ (ఇక్కడ ఎర్రర్ ఫిక్స్ చేశాను)
    window.approveRequest = async (docId, phone, amount) => {
        if(!confirm("₹" + amount + " అప్రూవ్ చేయమంటారా?")) return;
        try {
            const drRef = doc(db, "drivers", phone);
            const drSnap = await getDoc(drRef);
            
            // పాత బ్యాలెన్స్ ఉంటే తీసుకుంటుంది, లేకపోతే 0 అనుకుంటుంది
            let currentBal = 0;
            if (drSnap.exists() && drSnap.data().balance !== undefined) {
                currentBal = Number(drSnap.data().balance);
            }

            // కొత్త బ్యాలెన్స్ లెక్కించడం
            let newBal = currentBal + Number(amount);

            // setDoc తో merge:true వాడాను, కాబట్టి డాక్యుమెంట్ లేకపోయినా ఎర్రర్ రాదు, కొత్తగా క్రియేట్ అవుతుంది
            await setDoc(drRef, { balance: newBal }, { merge: true });
            
            // రిక్వెస్ట్ స్టేటస్‌ను approved గా మార్చడం
            await updateDoc(doc(db, "recharge_requests", docId), { status: "approved" });
            
            alert("రీఛార్జ్ విజయవంతంగా అప్రూవ్ చేయబడింది!");
        } catch(e) { 
            alert("ఎర్రర్ వచ్చింది: " + e.message); 
        }
    };
</script>
</body>
</html>
