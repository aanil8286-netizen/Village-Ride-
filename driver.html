<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - Captain</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#2c3e50">

    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 10px; text-align: center; }
        .wallet-card { background: #2c3e50; color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .ride-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: left; border-left: 5px solid #27ae60; }
        .cancel-card { background: #fde8e8; border-left: 5px solid #e74c3c; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: left; color: #9b1c1c; }
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 15px; }
        .btn-acc { background: #27ae60; color: white; }
        .btn-rej { background: #7f8c8d; color: white; margin-top: 5px; }
        .btn-comp { background: #e74c3c; color: white; }
        .btn-recharge { background: #e67e22; color: white; margin-top: 5px; }
        .btn-ok { background: #e74c3c; color: white; padding: 8px; font-size: 12px; }
        input { width: 90%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        .history-item { background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 5px; font-size: 14px; text-align: left; border-bottom: 1px solid #ddd; }
        #low-balance-alert { background: #ff7675; color: white; padding: 10px; border-radius: 10px; margin-bottom: 15px; display: none; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }
    </style>
</head>
<body>

<div class="wallet-card">
    <small>మీ వాలెట్ బ్యాలెన్స్</small>
    <h2 id="balance">₹0</h2>
    <div id="low-balance-alert">⚠️ బ్యాలెన్స్ అయిపోయింది! రీఛార్జ్ చేయండి.</div>
    <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; margin-top: 10px;">
        <input type="number" id="recharge-amount" placeholder="రీఛార్జ్ అమౌంట్" style="color: black;">
        <button class="btn btn-recharge" onclick="window.requestRecharge()">రీఛార్జ్ రిక్వెస్ట్ పంపండి</button>
    </div>
</div>

<div id="profile-box" style="background:white; padding:15px; border-radius:10px; margin-bottom:20px;">
    <p style="font-size: 12px; color: grey; margin: 0;">ప్రొఫైల్ వివరాలు</p>
    <input type="number" id="d-phone" placeholder="మీ ఫోన్ నంబర్">
    <input type="text" id="d-name" placeholder="మీ పేరు">
    <input type="text" id="d-bike" placeholder="బండి నంబర్">
</div>

<h3>కొత్త రైడ్ రిక్వెస్ట్‌లు</h3>
<div id="rides-list">వివరాలు లోడ్ అవుతున్నాయి...</div>

<hr>
<h3>పూర్తయిన రైడ్లు (History)</h3>
<div id="history-list">హిస్టరీ ఇక్కడ కనిపిస్తుంది...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, query, where, addDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    if(prompt("పాస్‌వర్డ్ ఇవ్వండి:") !== "123") window.location.href="about:blank";

    const firebaseConfig = {
        apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
        authDomain: "village-ride-e139b.firebaseapp.com",
        projectId: "village-ride-e139b",
        appId: "1:869545503903:web:35efe840f51f382ecf86aa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let myBalance = 0;
    let rejectedRides = []; 

    window.onload = () => {
        ['d-phone', 'd-name', 'd-bike'].forEach(id => {
            const val = localStorage.getItem(id);
            if(val) document.getElementById(id).value = val;
        });
        window.loadData();
    };

    ['d-phone', 'd-name', 'd-bike'].forEach(id => {
        document.getElementById(id).addEventListener('input', (e) => {
            localStorage.setItem(id, e.target.value);
            if(id === 'd-phone') window.loadData();
        });
    });

    window.loadData = () => {
        const phone = document.getElementById('d-phone').value;
        if(!phone) return;

        onSnapshot(doc(db, "drivers", phone), (docSnap) => {
            myBalance = docSnap.exists() ? (docSnap.data().balance || 0) : 0;
            document.getElementById('balance').innerText = "₹" + myBalance;
            document.getElementById('low-balance-alert').style.display = (myBalance <= 0) ? 'block' : 'none';
        });

        const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
        onSnapshot(query(collection(db, "rides"), where("status", "==", "completed"), where("driverPhone", "==", phone), where("timestamp", ">=", oneDayAgo)), (snap) => {
            let html = "";
            snap.forEach(d => { html += `<div class="history-item">🏁 ${d.data().drop} | 💰 ₹${d.data().fare}</div>`; });
            document.getElementById('history-list').innerHTML = html || "రైడ్స్ లేవు.";
        });
    };

    // 🚨 లైవ్ లిస్ట్ లో క్యాన్సిల్డ్ స్టేటస్‌ను కూడా వెతికేలా మార్చిన కోడ్
    const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
    onSnapshot(query(collection(db, "rides"), where("status", "in", ["pending", "accepted", "cancelled_by_user"]), where("timestamp", ">=", oneDayAgo)), (snap) => {
        let html = "";
        const myPhone = document.getElementById('d-phone').value;
        
        if (myBalance <= 0) {
            document.getElementById('rides-list').innerHTML = "<div style='color:red; padding:20px; font-weight:bold;'>మీ బ్యాలెన్స్ ₹0 కి చేరింది!</div>";
            return;
        }

        if(snap.empty) {
            document.getElementById('rides-list').innerHTML = "ప్రస్తుతం ఎటువంటి కొత్త రైడ్స్ లేవు.";
            return;
        }

        snap.forEach(d => {
            const data = d.data();
            if(rejectedRides.includes(d.id)) return;

            // 1. ఒకవేళ యూజర్ క్యాన్సిల్ చేస్తే ఎరుపు రంగు బాక్స్ చూపిస్తుంది
            if (data.status === "cancelled_by_user" && (data.driverPhone === myPhone || !data.driverPhone)) {
                html += `<div class="cancel-card">
                    <h3>❌ రైడ్ క్యాన్సిల్ చేయబడింది!</h3>
                    <p><b>యూజర్ ఫోన్:</b> ${data.userPhone}</p>
                    <p>📍 నుండి: ${data.pickup} | 🏁 కి: ${data.drop}</p>
                    <p style="font-weight:bold; color:red;">⚠️ ఈ రైడ్‌ను యూజర్ క్యాన్సిల్ చేసేశారు.</p>
                    <button class="btn btn-ok" onclick="window.clearCancelledRide('${d.id}')">సరే (తీసివేయి)</button>
                </div>`;
            }
            // 2. మామూలు పెండింగ్ లేదా యాక్సెప్ట్ అయిన రైడ్స్
            else if (data.status === "pending" || data.driverPhone === myPhone) {
                const isAcc = data.status === "accepted";
                html += `<div class="ride-card" id="card-${d.id}">
                    <p style="color:green; font-weight:bold; font-size:12px; margin:0 0 5px 0;">${data.status === 'pending' ? '⏳ కొత్త అభ్యర్థన' : '✅ మీరు ఒప్పుకున్న రైడ్'}</p>
                    <p>📍 <b>నుండి:</b> ${data.pickup} | 🏁 <b>కి:</b> ${data.drop}</p>
                    <p>💰 <b>ధర:</b> ₹${data.fare} | 📞 <b>యూజర్:</b> ${data.userPhone}</p>
                    ${!isAcc ? 
                    `<button class="btn btn-acc" onclick="window.updateRide('${d.id}', 'accepted')">రైడ్ అంగీకరించు</button>
                     <button class="btn btn-rej" onclick="window.rejectRide('${d.id}')">రిజెక్ట్</button>` : 
                    `<button class="btn btn-comp" onclick="window.updateRide('${d.id}', 'completed')">పూర్తి చేయి (₹5 కట్ అవుతుంది)</button>`}
                </div>`;
            }
        });
        document.getElementById('rides-list').innerHTML = html || "ప్రస్తుతం ఎటువంటి కొత్త రైడ్స్ లేవు.";
    });

    // డ్రైవర్ చూసాక ఆ క్యాన్సిల్ కార్డ్ ని స్క్రీన్ పై నుండి తీసేసే ఫంక్షన్
    window.clearCancelledRide = async (id) => {
        await deleteDoc(doc(db, "rides", id));
    };

    window.rejectRide = (id) => {
        if(confirm("ఈ రైడ్ మీకు వద్దు అనుకుంటున్నారా?")) {
            rejectedRides.push(id);
            const element = document.getElementById(`card-${id}`);
            if(element) element.remove();
        }
    };

    window.updateRide = async (id, status) => {
        const phone = document.getElementById('d-phone').value;
        const name = document.getElementById('d-name').value;
        const bike = document.getElementById('d-bike').value;

        if(!phone || !name || !bike) { alert("వివరాలు నింపండి"); return; }

        const rideRef = doc(db, "rides", id);
        const rideSnap = await getDoc(rideRef);
        
        if(!rideSnap.exists() || rideSnap.data().status === "cancelled_by_user") {
            alert("⚠️ క్షమించండి! యూజర్ ఈ రైడ్‌ను ఆల్రెడీ క్యాన్సిల్ చేసేశారు.");
            return;
        }

        if (status === 'accepted' && rideSnap.data().status === 'accepted') {
            alert("సారీ! ఈ రైడ్ ఇప్పటికే వేరే డ్రైవర్ తీసుకున్నారు.");
            return;
        }

        if(status === 'completed') {
            await updateDoc(doc(db, "drivers", phone), { balance: myBalance - 5 });
            await addDoc(collection(db, "admin_earnings"), { driverPhone: phone, amount: 5, timestamp: Date.now() });
        }

        const upData = { status: status };
        if(status === 'accepted') { upData.driverName = name; upData.driverPhone = phone; upData.bikeNumber = bike; }
        await updateDoc(rideRef, upData);
        if(status === 'accepted') alert("రైడ్ సక్సెస్‌ఫుల్ గా అంగీకరించారు!");
    };

    window.requestRecharge = async () => {
        const amt = document.getElementById('recharge-amount').value;
        const phone = document.getElementById('d-phone').value;
        const name = document.getElementById('d-name').value;
        if(!amt || !phone || !name) { alert("వివరాలు నింపండి"); return; }
        await addDoc(collection(db, "recharge_requests"), { driverName: name, driverPhone: phone, amount: parseInt(amt), status: "pending", timestamp: Date.now() });
        alert("అభ్యర్థన పంపబడింది!");
        document.getElementById('recharge-amount').value = "";
    };
</script>
</body>
</html>
