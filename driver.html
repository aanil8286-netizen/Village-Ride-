<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - Captain</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .wallet-card { background: #2c3e50; color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
        .ride-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-acc { background: #27ae60; color: white; }
        .btn-comp { background: #e74c3c; color: white; }
        input { width: 90%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="wallet-card">
    <small>మీ వాలెట్ బ్యాలెన్స్</small>
    <h2 id="balance">₹0</h2>
</div>

<div id="profile-box" style="background:white; padding:15px; border-radius:10px; margin-bottom:20px;">
    <input type="text" id="d-name" placeholder="మీ పేరు">
    <input type="text" id="d-bike" placeholder="బండి నంబర్">
    <input type="number" id="d-phone" placeholder="మీ ఫోన్ నంబర్">
</div>

<h3>కొత్త రైడ్స్</h3>
<div id="rides-list"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    if(prompt("Password:") !== "123") window.location.href="about:blank";

    const firebaseConfig = {
        apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
        authDomain: "village-ride-e139b.firebaseapp.com",
        projectId: "village-ride-e139b",
        storageBucket: "village-ride-e139b.firebasestorage.app",
        messagingSenderId: "869545503903",
        appId: "1:869545503903:web:35efe840f51f382ecf86aa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // వాలెట్ లోకల్ మెమరీలో దాచుకుంటున్నాం (ప్రస్తుతానికి)
    let myBalance = localStorage.getItem('wallet') || 0;
    document.getElementById('balance').innerText = "₹" + myBalance;

    onSnapshot(query(collection(db, "rides"), where("status", "in", ["pending", "accepted"])), (snap) => {
        let html = "";
        snap.forEach(d => {
            const data = d.data();
            const isAcc = data.status === "accepted";
            html += `<div class="ride-card">
                <p>📍 <b>నుండి:</b> ${data.pickup} | 🏁 <b>కి:</b> ${data.drop}</p>
                <p>💰 <b>ధర:</b> ₹${data.fare} | 📞 <b>యూజర్:</b> ${data.userPhone}</p>
                ${!isAcc ? `<button class="btn btn-acc" onclick="updateRide('${d.id}', 'accepted')">Accept Ride</button>` : 
                `<button class="btn btn-comp" onclick="updateRide('${d.id}', 'completed')">Complete & Pay ₹5 Commission</button>`}
            </div>`;
        });
        document.getElementById('rides-list').innerHTML = html || "రైడ్స్ లేవు.";
    });

    window.updateRide = async (id, status) => {
        const name = document.getElementById('d-name').value;
        const bike = document.getElementById('d-bike').value;
        const phone = document.getElementById('d-phone').value;

        if(!name || !bike || !phone) { alert("ప్రొఫైల్ వివరాలు నింపండి"); return; }

        if(status === 'completed') {
            myBalance -= 5; // ప్రతి రైడ్ కి ₹5 కట్
            localStorage.setItem('wallet', myBalance);
            document.getElementById('balance').innerText = "₹" + myBalance;
        }

        const upData = { status: status };
        if(status === 'accepted') {
            upData.driverName = name; upData.bikeNumber = bike; upData.driverPhone = phone;
        }
        await updateDoc(doc(db, "rides", id), upData);
    };
</script>
</body>
</html>
