<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const firebaseConfig = { /* // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
  authDomain: "village-ride-e139b.firebaseapp.com",
  projectId: "village-ride-e139b",
  storageBucket: "village-ride-e139b.firebasestorage.app",
  messagingSenderId: "869545503903",
  appId: "1:869545503903:web:35efe840f51f382ecf86aa",
  measurementId: "G-N23Y5LCWD0"
}; */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // డేటా వస్తుందో లేదో చెక్ చేయడానికి ఈ కోడ్ వాడండి
    onSnapshot(collection(db, "rides"), (snapshot) => {
        if (snapshot.empty) {
            console.log("డేటాబేస్ ఖాళీగా ఉంది!");
            return;
        }
        
        snapshot.docChanges().forEach((change) => {
            if (change.type === "added") {
                const data = change.doc.data();
                document.getElementById('ride-alert').style.display = 'block';
                document.getElementById('details').innerText = data.pickup + " నుండి " + data.drop;
                alert("కొత్త రైడ్ రిక్వెస్ట్ వచ్చింది!"); // స్క్రీన్ మీద మెసేజ్ వస్తుంది
            }
        });
    });
</script>
