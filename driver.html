<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <title>Village Ride - Captain</title>
</head>
<body style="background:#2c3e50; color:white; font-family:sans-serif; text-align:center; padding:20px;">

    <h2>Captain Dashboard 👨‍✈️</h2>
    <div id="rides-list">లోడ్ అవుతోంది...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
            authDomain: "village-ride-e139b.firebaseapp.com",
            projectId: "village-ride-e139b",
            storageBucket: "village-ride-e139b.firebasestorage.app",
            messagingSenderId: "869545503903",
            appId: "1:869545503903:web:35efe840f51f382ecf86aa",
            measurementId: "G-N23Y5LCWD0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const q=collection(db, "rides"), (snapshot) => {
            const list = document.getElementById('rides-list');
            let html = "";
            
            if (snapshot.empty) {
                list.innerHTML = "ప్రస్తుతానికి బుకింగ్స్ ఏమీ లేవు.";
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const isAccepted = data.status === "accepted";
                
                html += `
                    <div style="background:white; color:black; padding:15px; margin:10px auto; border-radius:10px; max-width:300px; text-align:left;">
                        <p>📍 <b>నుండి:</b> ${data.pickup || 'N/A'}</p>
                        <p>🏁 <b>కి:</b> ${data.drop || 'N/A'}</p>
                        <button style="width:100%; padding:10px; background:${isAccepted ? '#ccc' : '#27ae60'}; color:white; border:none; cursor:pointer;" 
                                onclick="window.acceptRide('${id}')" ${isAccepted ? 'disabled' : ''}>
                            ${isAccepted ? 'అంగీకరించబడింది' : 'రైడ్ అంగీకరించు'}
                        </button>
                    </div>`;
            });
            list.innerHTML = html;
        });

        window.acceptRide = async (id) => {
            try {
                await updateDoc(doc(db, "rides", id), { status: "accepted" });
                alert("రైడ్ కన్ఫర్మ్ అయ్యింది!");
            } catch (e) { alert("Error: " + e.message); }
        };
    </script>
</body>
</html>
