<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - Captain</title>
    
    <!-- 🛺 డ్రైవర్ పేజీ కి కూడా అదే బైక్ ఐకాన్ -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3063/3063198.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063198.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    </style>
</head>
<body>

<div class="wallet-card">
    <small>మీ వాలెట్ బ్యాలెన్స్</small>
    <h2 id="balance">₹0</h2>
    <div id="low-balance-alert">⚠️ బ్యాలెన్స్ అయిపోయింది! రీఛార్జ్ చేయండి.</div>
    <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; margin-top: 10px;">
        <input type="number" id="recharge-amount" placeholder="రీఛార్జ్ అమౌంట్" style="color: black;">
        <button class="btn btn-recharge" onclick="window.requestRecharge()">రీఛార్జ్ రిక్వెస్ట్ పంపండి</button>
    </div>
</div>

<div id="profile-box" style="background:white; padding:15px; border-radius:10px; margin-bottom:20px;">
    <p style="font-size: 12px; color: grey; margin: 0;">ప్రొఫైల్ వివరాలు</p>
    <input type="number" id="d-phone" placeholder="మీ ఫోన్ నంబర్">
    <input type="text" id="d-name" placeholder="మీ పేరు">
    <input type="text" id="d-bike" placeholder="బండి నంబర్">
</div>

<h3>కొత్త రైడ్ రిక్వెస్ట్‌లు</h3>
<div id="rides-list">వివరాలు లోడ్ అవుతున్నాయి...</div>

<hr>
<h3>పూర్తయిన రైడ్లు (History)</h3>
<div id="history-list">హిస్టరీ ఇక్కడ కనిపిస్తుంది...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, query, where, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    if(prompt("పాస్‌వర్డ్ ఇవ్వండి:") !== "123") window.location.href="about:blank";

    const firebaseConfig = {
        apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
        authDomain: "village-ride-e139b.firebaseapp.com",
        projectId: "village-ride-e139b",
        appId: "1:869545503903:web:35efe840f51f382ecf86aa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let myBalance = 0;
    let rejectedRides = []; 

    window.onload = () => {
        ['d-phone', 'd-name', 'd-bike'].forEach(id => {
            const val = localStorage.getItem(id);
            if(val) document.getElementById(id).value = val;
        });
        window.loadData();
    };

    ['d-phone', 'd-name', 'd-bike'].forEach(id => {
        document.getElementById(id).addEventListener('input', (e) => {
            localStorage.setItem(id, e.target.value);
            if(id === 'd-phone') window.loadData();
        });
    });

    window.loadData = () => {
        const phone = document.getElementById('d-phone').value;
        if(!phone) return;

        onSnapshot(doc(db, "drivers", phone), (docSnap) => {
            myBalance = docSnap.exists() ? (docSnap.data().balance || 0) : 0;
            document.getElementById('balance').innerText = "₹" + myBalance;
            document.getElementById('low-balance-alert').style.display = (myBalance <= 0) ? 'block' : 'none';
        });

        onSnapshot(query(collection(db, "rides"), where("status", "==", "completed"), where("driverPhone", "==", phone)), (snap) => {
            let html = "";
            snap.forEach(d => { html += `<div class="history-item">🏁 ${d.data().drop} | 💰 ₹${d.data().fare}</div>`; });
            document.getElementById('history-list').innerHTML = html || "రైడ్స్ లేవు.";
        });
    };

    // లైవ్ రైడ్స్
    onSnapshot(query(collection(db, "rides"), where("status", "in", ["pending", "accepted"])), (snap) => {
        let html = "";
        const myPhone = document.getElementById('d-phone').value;
        
        if (myBalance <= 0) {
            document.getElementById('rides-list').innerHTML = "<div style='color:red; padding:20px; font-weight:bold;'>మీ బ్యాలెన్స్ ₹0 కి చేరింది. రీఛార్జ్ చేయండి!</div>";
            return;
        }

        snap.forEach(d => {
            const data = d.data();
            if(rejectedRides.includes(d.id)) return;

            if (data.status === "pending" || data.driverPhone === myPhone) {
                const isAcc = data.status === "accepted";
                html += `<div class="ride-card" id="card-${d.id}">
                    <p>📍 <b>నుండి:</b> ${data.pickup} | 🏁 <b>కి:</b> ${data.drop}</p>
                    <p>💰 <b>ధర:</b> ₹${data.fare} | 📞 <b>యూజర్:</b> ${data.userPhone}</p>
                    ${!isAcc ? 
                    `<button class="btn btn-acc" onclick="window.updateRide('${d.id}', 'accepted')">రైడ్ అంగీకరించు</button>
                     <button class="btn btn-rej" onclick="window.rejectRide('${d.id}')">రిజెక్ట్</button>` : 
                    `<button class="btn btn-comp" onclick="window.updateRide('${d.id}', 'completed')">పూర్తి చేయి (₹5 కట్ అవుతుంది)</button>`}
                </div>`;
            }
        });
        document.getElementById('rides-list').innerHTML = html || "ప్రస్తుతం ఎటువంటి కొత్త రైడ్స్ లేవు.";
    });

    window.rejectRide = (id) => {
        if(confirm("ఈ రైడ్ మీకు వద్దు అనుకుంటున్నారా?")) {
            rejectedRides.push(id);
            const element = document.getElementById(`card-${id}`);
            if(element) element.remove();
        }
    };

    window.updateRide = async (id, status) => {
        const phone = document.getElementById('d-phone').value;
        const name = document.getElementById('d-name').value;
        const bike = document.getElementById('d-bike').value;

        if(!phone || !name || !bike) { alert("వివరాలు నింపండి"); return; }

        const rideRef = doc(db, "rides", id);
        const rideSnap = await getDoc(rideRef);
        if (status === 'accepted' && rideSnap.data().status === 'accepted') {
            alert("సారీ! ఈ రైడ్ ఇప్పటికే వేరే డ్రైవర్ తీసుకున్నారు.");
            return;
        }

        if(status === 'completed') {
            await updateDoc(doc(db, "drivers", phone), { balance: myBalance - 5 });
            await addDoc(collection(db, "admin_earnings"), { driverPhone: phone, amount: 5, timestamp: Date.now() });
        }

        const upData = { status: status };
        if(status === 'accepted') { upData.driverName = name; upData.driverPhone = phone; upData.bikeNumber = bike; }
        await updateDoc(rideRef, upData);
        if(status === 'accepted') alert("రైడ్ సక్సెస్‌ఫుల్ గా అంగీకరించారు!");
    };

    window.requestRecharge = async () => {
        const amt = document.getElementById('recharge-amount').value;
        const phone = document.getElementById('d-phone').value;
        const name = document.getElementById('d-name').value;
        if(!amt || !phone || !name) { alert("వివరాలు నింపండి"); return; }
        await addDoc(collection(db, "recharge_requests"), { driverName: name, driverPhone: phone, amount: parseInt(amt), status: "pending", timestamp: Date.now() });
        alert("అభ్యర్థన పంపబడింది!");
        document.getElementById('recharge-amount').value = "";
    };
</script>
</body>
</html>
