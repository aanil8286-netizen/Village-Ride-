<!-- driver.html లో ఉండవలసిన కోడ్ -->
<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - Driver</title><!-- బైక్ ఐకాన్ కోసం ఈ లైన్ యాడ్ చేయండి -->
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3198/3198336.png">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3198/3198336.png">
    
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .alert { background: white; color: #333; padding: 20px; border-radius: 15px; margin-top: 20px; display: none; }
        button { background: green; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Captain Dashboard 👨‍✈️</h2>
    <p>కొత్త రైడ్స్ కోసం వేచి చూడండి...</p>
    <div id="ride-alert" class="alert">
        <h3>కొత్త రిక్వెస్ట్! 🔔</h3>
        <p id="details"></p>
        <button onclick="acceptRide()">Accept Ride</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = { // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
  authDomain: "village-ride-e139b.firebaseapp.com",
  projectId: "village-ride-e139b",
  storageBucket: "village-ride-e139b.firebasestorage.app",
  messagingSenderId: "869545503903",
  appId: "1:869545503903:web:35efe840f51f382ecf86aa",
  measurementId: "G-N23Y5LCWD0"
};
        const db = getFirestore(initializeApp(firebaseConfig));

        const q = collection(db, "rides");
        onSnapshot(q, (snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    document.getElementById('ride-alert').style.display = 'block';
                    document.getElementById('details').innerText = change.doc.data().pickup + " నుండి " + change.doc.data().drop;
                }
            });
        });
        window.acceptRide = () => { alert("Accepted!"); document.getElementById('ride-alert').style.display = 'none'; };
    </script>
</body>
</html>
