<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - Captain</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3198/3198336.png">
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .ride-card { background: white; color: #333; padding: 15px; border-radius: 10px; margin: 15px auto; max-width: 400px; text-align: left; }
        .btn { background: #27ae60; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .accepted { background: #95a5a6 !important; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>Captain Dashboard 👨‍✈️</h2>
    <div id="rides-list">రిక్వెస్ట్‌ల కోసం చూస్తున్నాము...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

     const firebaseConfig = {// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
  authDomain: "village-ride-e139b.firebaseapp.com",
  projectId: "village-ride-e139b",
  storageBucket: "village-ride-e139b.firebasestorage.app",
  messagingSenderId: "869545503903",
  appId: "1:869545503903:web:35efe840f51f382ecf86aa",
  measurementId: "G-N23Y5LCWD0"
};

     const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const q = collection(db, "rides");

        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('rides-list');
            let html = "";
            snapshot.forEach((documentSnap) => {
                const data = documentSnap.data();
                const id = documentSnap.id;
                const isAccepted = data.status === "accepted";
                
                html += `
                    <div class="ride-card">
                        <p>📍 <b>నుండి:</b> ${data.pickup}</p>
                        <p>🏁 <b>కి:</b> ${data.drop}</p>
                        <button class="btn ${isAccepted ? 'accepted' : ''}" 
                                onclick="${isAccepted ? '' : `acceptRide('${id}')`}">
                            ${isAccepted ? 'అంగీకరించబడింది (Accepted)' : 'రైడ్ అంగీకరించు (Accept)'}
                        </button>
                    </div>`;
            });
            list.innerHTML = html || "రైడ్స్ లేవు.";
        });

        window.acceptRide = async (id) => {
            try {
                await updateDoc(doc(db, "rides", id), { status: "accepted" });
                alert("రైడ్ అంగీకరించారు!");
            } catch (e) { alert("Error: " + e.message); }
        };
    </script>
</body>
</html>
