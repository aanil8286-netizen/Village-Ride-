<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <title>Village Ride - Captain</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .ride-card { background: white; color: #333; padding: 15px; border-radius: 10px; margin: 15px auto; max-width: 350px; text-align: left; }
        .btn { border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-accept { background: #27ae60; color: white; }
        .btn-complete { background: #e74c3c; color: white; }
    </style>
</head>
<body>
    <h2>Captain Dashboard 👨‍✈️</h2>
    <input type="number" id="driver-phone" placeholder="మీ ఫోన్ నంబర్">
    <div id="rides-list"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. పాస్‌వర్డ్ సెక్యూరిటీ
        const checkPassword = () => {
            const pass = prompt("డ్రైవర్ పాస్‌వర్డ్ ఎంటర్ చేయండి:");
            if (pass !== "123") { // ఇక్కడ మీ పాస్‌వర్డ్
                alert("అనధికారిక యాక్సెస్!");
                window.location.href = "about:blank";
            }
        };
        checkPassword();

        const firebaseConfig = {
            apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
            authDomain: "village-ride-e139b.firebaseapp.com",
            projectId: "village-ride-e139b",
            storageBucket: "village-ride-e139b.firebasestorage.app",
            messagingSenderId: "869545503903",
            appId: "1:869545503903:web:35efe840f51f382ecf86aa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const q = query(collection(db, "rides"), where("status", "in", ["pending", "accepted"]));

        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('rides-list');
            if (snapshot.empty) { list.innerHTML = "ప్రస్తుతానికి బుకింగ్స్ లేవు."; return; }
            
            let html = "";
            snapshot.forEach((dSnap) => {
                const data = dSnap.data();
                const id = dSnap.id;
                const isAcc = data.status === "accepted";
                
                html += `<div class="ride-card">
                    <p>📍 నుండి: ${data.pickup}</p><p>🏁 కి: ${data.drop}</p>
                    ${!isAcc ? 
                        `<button class="btn btn-accept" onclick="window.updateRide('${id}', 'accepted')">రైడ్ అంగీకరించు</button>` : 
                        `<p style="color:green">✅ మీరు ఈ రైడ్‌లో ఉన్నారు</p>
                         <button class="btn btn-complete" onclick="window.updateRide('${id}', 'completed')">రైడ్ పూర్తి చేయి</button>`
                    }
                </div>`;
            });
            list.innerHTML = html;
        });

        window.updateRide = async (id, newStatus) => {
            const phone = document.getElementById('driver-phone').value;
            if(newStatus === 'accepted' && (!phone || phone.length < 10)) { alert("ఫోన్ నంబర్ ఇవ్వండి"); return; }
            try {
                const updateData = { status: newStatus };
                if(newStatus === 'accepted') updateData.driverPhone = phone;
                await updateDoc(doc(db, "rides", id), updateData);
            } catch (e) { alert("Error: " + e.message); }
        };
    </script>
</body>
</html>
