<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Ride - Driver</title>
    <!-- బైక్ ఐకాన్ -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3198/3198336.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3198/3198336.png">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .card { background: white; color: #333; padding: 20px; border-radius: 15px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; }
        .btn { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 10px; }
        h2 { color: #f1c40f; }
        #no-rides { margin-top: 50px; color: #bdc3c7; }
    </style>
</head>
<body>

    <h2>Captain Dashboard 👨‍✈️</h2>
    <p id="no-rides">కొత్త రిక్వెస్ట్‌ల కోసం వెతుకుతున్నాము...</p>

    <!-- కొత్త రైడ్ అలర్ట్ బాక్స్ -->
    <div id="ride-alert" class="card">
        <h3 style="color: #e67e22;">కొత్త రిక్వెస్ట్! 🔔</h3>
        <hr>
        <p id="details" style="font-size: 20px; font-weight: bold;"></p>
        <button class="btn" onclick="acceptRide()">రైడ్ అంగీకరించు (Accept)</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAq3c99VFxiIEI_RCR66IS1rd5ay4R_hVQ",
  authDomain: "village-ride-e139b.firebaseapp.com",
  projectId: "village-ride-e139b",
  storageBucket: "village-ride-e139b.firebasestorage.app",
  messagingSenderId: "869545503903",
  appId: "1:869545503903:web:35efe840f51f382ecf86aa",
  measurementId: "G-N23Y5LCWD0"
};
        const firebaseConfig = {
            apiKey: "మీ_API_KEY",
            authDomain: "మీ_PROJECT_ID.firebaseapp.com",
            projectId: "మీ_PROJECT_ID",
            storageBucket: "మీ_PROJECT_ID.appspot.com",
            messagingSenderId: "మీ_SENDER_ID",
            appId: "మీ_APP_ID"
        };
        // -----------------------------------------------------

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // డేటాబేస్ నుండి లైవ్ అప్‌డేట్స్ తీసుకోవడం
        const q = query(collection(db, "rides"), orderBy("time", "desc"));

        onSnapshot(q, (snapshot) => {
            if (!snapshot.empty) {
                document.getElementById('no-rides').style.display = 'none';
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        document.getElementById('ride-alert').style.display = 'block';
                        document.getElementById('details').innerText = data.pickup + " నుండి " + data.drop;
                        
                        // కొత్త రైడ్ రాగానే ఫోన్ వైబ్రేట్ అవ్వడానికి లేదా అలర్ట్ రావడానికి
                        if(window.confirm("కొత్త రైడ్ రిక్వెస్ట్ వచ్చింది! చూడాలా?")) {
                            window.focus();
                        }
                    }
                });
            }
        }, (error) => {
            console.error("Error: ", error);
            alert("డేటా రావడంలో సమస్య ఉంది. రూల్స్ చెక్ చేయండి.");
        });

        window.acceptRide = () => {
            alert("రైడ్ కన్ఫర్మ్ అయ్యింది! బయల్దేరండి.");
            document.getElementById('ride-alert').style.display = 'none';
        };
    </script>
</body>
</html>
